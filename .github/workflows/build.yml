name: Build TWRP for EveryPhone EP-171EN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3

      - name: Sync TWRP Minimal Manifest
        run: |
          mkdir ~/twrp
          cd ~/twrp
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-7.1
          repo sync -j$(nproc)

      - name: Add Device Tree
        run: |
          mkdir -p ~/twrp/device/everyphone/ep171en
          cp -r $GITHUB_WORKSPACE/* ~/twrp/device/everyphone/ep171en/

      - name: Build TWRP
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_ep171en-eng
          make recoveryimage -j$(nproc)

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v3
        with:
          name: TWRP-Recovery-EP171EN
          path: /home/runner/twrp/out/target/product/ep171en/recovery.img
