name: Build TWRP for EveryPhone EP-171EN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 最新の機体の中に、Androidビルドに最適な「コンテナ」を召喚するぞ！
    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          # コンテナ内の時刻設定を飛ばすための呪文だ
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y bc build-essential zip curl libstdc++6 git wget python2 python3 python-is-python2 sudo
          # repoツールの準備
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Sync TWRP Minimal Manifest
        run: |
          mkdir ~/twrp
          cd ~/twrp
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-7.1
          ~/bin/repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Fix Source and Add Device Tree
        run: |
          # Pythonのエラーを自動修正
          sed -i 's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/g' ~/twrp/build/tools/roomservice.py
          
          # デバイスツリーの配置
          rm -rf ~/twrp/device/everyphone/ep171en
          mkdir -p ~/twrp/device/everyphone/ep171en
          cp -rv $GITHUB_WORKSPACE/device/everyphone/ep171en/* ~/twrp/device/everyphone/ep171en/
          
          # 自動リネーム補正
          cd ~/twrp/device/everyphone/ep171en
          [ -f ep171en.mk ] && mv ep171en.mk omni_ep171en.mk || true

      - name: Build TWRP
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          # ビルド開始！
          /bin/bash -c "source build/envsetup.sh && lunch omni_ep171en-eng && make recoveryimage -j$(nproc)"

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Recovery-EP171EN
          path: /home/runner/twrp/out/target/product/ep171en/recovery.img
