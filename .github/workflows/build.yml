- name: Build TWRP
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          # roomservice（自動検索）をスキップさせる呪文だ！
          export SKIP_ROOMSERVICE=true
          source build/envsetup.sh
          # 直接、製品のフルパスを指定して呼び出すぞ
          lunch omni_ep171en-eng
          make recoveryimage -j$(nproc)
